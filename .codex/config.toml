[mcp_servers.project_bridge]
url = "http://127.0.0.1:8010/mcp"
http_headers = { "X-Project-Bridge-Client" = "codex-local", "X-Project-Bridge-Scopes" = "projects:read,approvals:read,tasks:propose" }
enabled_tools = ["list_projects", "get_project_context", "list_project_blockers", "get_approval_status", "propose_task"]
default_tools_approval_mode = "writes"
startup_timeout_sec = 10
tool_timeout_sec = 30
enabled = true
required = false
